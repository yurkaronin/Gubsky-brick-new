<section class="promo-section">
      <div class="wrapper">
        <div class="promo-section__container">

          <div class="promo-section-header">
            <div class="promo-section-header__grid">
              <div class="promo-section-header__col -left">
                <div class="promo-section-header__image">
                  <img src="./assets/img/promo-section-header/1.png" alt="" />
                </div>
              </div>
              <div class="promo-section-header__col -right">
                <p class="promo-section-header__text">После заполнения простой формы скачивание буклета начнется автоматически</p>
                <h2 class="promo-section-header__title">Получить буклет «10 советов при строительстве частного дома»</h2>
              </div>

            </div>

          </div>
          <div class="promo-section__body">

            <div class="promo-section-form">

              <div class="promo-section-form__grid">

                <div class="promo-section-form__col">
                  <label class="label -mod" for="user-name-4">Ваше имя:</label>
                  <div class="input">
                    <input type="text" id="user-name-4" placeholder="Представьтесь, пожалуйста" required />
                  </div>
                </div>
                <div class="promo-section-form__col">
                  <label class="label -mod" for="user-phone-4">Телефон:</label>
                  <div class="input">
                    <input type="tel" id="user-phone-4" placeholder="Введите Ваш номер" required />
                  </div>
                </div>
                <div class="promo-section-form__col -full">
                  <div class="simple-grid">
                    <div class="simple-grid__col">
                      <div class="form-agree">
                        <input class="visually-hidden" type="checkbox" id="user-agree-4" required checked>
                        <label for="user-agree-4">Даю согласие на обработку <a href="#" target="_blank">персональных
                            данных</a> и принимаю <a href="#" target="_blank">политику конфиденциальности</a></label>
                      </div>
                    </div>
                    <div class="simple-grid__col">
                      <button class="button -icon-right -send -red-color" type="submit">Отправить</button>
                    </div>
                  </div>


                </div>
              </div>



            </div>

          </div>
        </div>

      </div>
    </section>
