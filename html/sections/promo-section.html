<section class="promo-section">
  <div class="wrapper">
    <div class="promo-section__container">

      <div class="promo-section-header">
        <div class="promo-section-header__grid">
          <div class="promo-section-header__col -left">
            <div class="promo-section-header__image">
              <img src="{{ assets }}/img/promo-section-header/1.png" alt="" />
            </div>
          </div>
          <div class="promo-section-header__col -right">
            <p class="promo-section-header__text">После заполнения простой формы скачивание буклета начнется
              автоматически</p>
            <h2 class="promo-section-header__title">Получить буклет «10 советов при строительстве частного дома»</h2>
          </div>

        </div>

      </div>
      <div class="promo-section__body">

        <div class="promo-section-form">

          <div class="promo-section-form__grid">

            <div class="promo-section-form__col">
              <label class="label -mod" for="user-name-4">Ваше имя:</label>
              <div class="input">
                <input type="text" id="user-name-4" placeholder="Представьтесь, пожалуйста" required />
              </div>
            </div>
            <div class="promo-section-form__col">
              <label class="label -mod" for="user-phone-4">Телефон:</label>
              <div class="input">
                <input type="tel" id="user-phone-4" placeholder="Введите Ваш номер" required />
              </div>
            </div>
            <div class="promo-section-form__col -full">
              <div class="promo-section-form__agree">
                <div class="promo-section-form__agree-col">
                  <div class="form-agree">
                    <input class="visually-hidden" type="checkbox" id="user-agree-6" required checked>

                    <label class="form-agree__control" aria-hidden="true" for="user-agree-6">
                      <span class="form-agree__control-icon"></span>
                    </label>
                    <span class="form-agree__text">Даю согласие на обработку <a href="#" target="_blank">персональных
                        данных</a> и принимаю <a href="#" target="_blank">политику конфиденциальности</a></span>
                    </label>
                  </div>
                </div>
                <div class="promo-section-form__agree-col">
                  <button class="button -red -small" type="submit">Отправить
                    <span class="button__icon -mod">
                      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                          d="M7.86114 10.1387L12.22 5.77975M16.679 3.11955L12.9996 15.0776C12.6699 16.1493 12.5049 16.6854 12.2205 16.8631C11.9738 17.0172 11.6684 17.043 11.3998 16.9315C11.09 16.8029 10.8385 16.3009 10.337 15.2978L8.00651 10.6368C7.92691 10.4776 7.88707 10.3983 7.83391 10.3294C7.78673 10.2682 7.73228 10.213 7.67107 10.1658C7.60366 10.1139 7.52573 10.0749 7.37364 9.99887L2.70199 7.66301C1.69882 7.16142 1.19719 6.91039 1.06864 6.6006C0.957168 6.33194 0.982591 6.02623 1.13672 5.77955C1.31444 5.49511 1.85048 5.32986 2.92246 5.00002L14.8804 1.32061C15.7231 1.0613 16.1447 0.931747 16.4293 1.03625C16.6773 1.12728 16.8728 1.32256 16.9638 1.57051C17.0682 1.85504 16.9386 2.27638 16.6795 3.11831L16.679 3.11955Z"
                          stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                    </span>
                  </button>
                </div>
              </div>


            </div>
          </div>



        </div>

      </div>
    </div>

  </div>
</section>
